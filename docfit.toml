# docfit's own documents, each under its kind (`docfit check --help`); the gate runs `docfit check` on them.
# ignore: tests whose fixtures write made-up tracker refs, the ref detector's test data.
ignore = ["tests/next.rs", "tests/refs.rs", "tests/where.rs"]

[documents]
"README.md" = "readme"
"CLAUDE.md" = "agent"
